[project]
name = "orc-engine"
version = "0.1.1"
description = "A subject-generic rule evaluator and the value coercions it is configured with"
requires-python = ">=3.14"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
test = ["pytest==9.0.1", "freezegun==1.5.5"]
lint = ["ruff==0.14.2", "mypy==1.18.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orc_engine"]

[tool.ruff]
line-length = 150

[tool.mypy]
python_version = "3.14"
files = ["src/orc_engine"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
