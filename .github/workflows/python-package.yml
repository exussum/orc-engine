name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Set up Python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14"
    - name: Compute cache week
      id: week
      run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"
    - name: Cache tool installs
      id: cache-tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          ~/.local
          ~/.opengrep
        key: tools-${{ runner.os }}-${{ steps.week.outputs.week }}-${{ hashFiles('.github/workflows/python-package.yml') }}
    - name: Add local bin to PATH
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install uv
      if: steps.cache-tools.outputs.cache-hit != 'true'
      run: |
        curl -LsSf https://astral.sh/uv/0.11.23/install.sh -o /tmp/uv-install.sh
        sh /tmp/uv-install.sh
    - name: Install opengrep and pip-audit
      if: steps.cache-tools.outputs.cache-hit != 'true'
      run: |
        curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/526deafe6f0519c272bbee316fea8df26dd85dfa/install.sh -o /tmp/opengrep-install.sh
        bash /tmp/opengrep-install.sh -v v1.25.0
        uv tool install pip-audit==2.10.1
    - name: Cache pre-commit hooks
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Run pre-commit
      run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
